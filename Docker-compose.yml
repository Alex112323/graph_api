services:
  init:
    image: alpine:latest
    volumes:
      - shared_env:/shared
      - .:/app
    working_dir: /app
    entrypoint: ["sh", "-c", "sh scripts/run.sh && cp -n .env.sample /shared/.env"]


  db:
    image: postgres:13
    depends_on:
      - init
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - shared_env:/shared
      - postgres_data:/var/lib/postgresql/data
    working_dir: /shared
    command: sh -c "cp -n .env .env.backup && docker-entrypoint.sh postgres"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  api:
    build: .
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=db
    ports:
      - "8080:8080"
    volumes:
      - ./app:/graph_api/app
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  shared_env:
  postgres_data:
